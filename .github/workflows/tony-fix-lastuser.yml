name: tony-fix-lastuser

on:
  push:
    branches: [opencode2]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'tony: fix lastUser parts')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opencode2

      - name: Fix lastUser message access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('packages/opencode/src/session/prompt.ts')
          s = p.read_text()

          pattern = r'(?m)^\s*const userObjective = lastUser\.parts\n(?:\s*\.filter\(\(part\): part is SessionV1\.TextPart => part\.type === "text"\)\n\s*\.map\(\(part\) => part\.text\)\n\s*\.join\("\\\\n"\))'
          replacement = '''            const lastUserMsg = msgs.findLast(
              (msg) => msg.info.role === "user" && msg.info.id === lastUser.id,
            )
            const userObjective = lastUserMsg?.parts
              .filter((part): part is SessionV1.TextPart => part.type === "text")
              .map((part) => part.text)
              .join("\\n") ?? ""'''

          s2, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit('target block not found')

          p.write_text(s2)
          PY

      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/tony-fix-lastuser.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/opencode/src/session/prompt.ts .github/workflows/tony-fix-lastuser.yml
          git commit -m 'tony: fix lastUser parts'
          git push origin HEAD:opencode2
