name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make sqlite3

      - name: Install Python dev/test dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Validate test discovery conventions
        run: make check-test-discovery
        shell: bash

      - name: Run complete local suite
        run: make test
        shell: bash

      - name: Run Python coverage
        if: matrix.python-version == '3.12'
        run: make coverage
        shell: bash

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          include-hidden-files: true
          path: |
            coverage.xml
            coverage-contexts.json
            coverage-bun/lcov.info
          if-no-files-found: error

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          cd docker && docker compose build
        shell: bash
