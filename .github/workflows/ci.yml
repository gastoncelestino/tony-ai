name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make sqlite3

      - name: Install Python dev/test dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: |
          python3 tests/test_local_memory_server.py
          python3 tests/test_code_index_core.py
          python3 tests/test_judgment_memory_ledger.py
        shell: bash

      - name: Run Kernel tests
        run: |
          python3 tests/test_kernel_state_machine.py
          python3 tests/test_kernel_integration.py
          python3 tests/test_kernel_cli.py
          python3 tests/test_kernel_hardening.py
          python3 tests/test_kernel_enforcement.py
          python3 tests/test_sdd_flow_e2e.py
          bun test ./tests/test_tony_kernel_hooks.ts
          bun test ./tests/test_tony_kernel_integration.ts
          bun test ./tests/test_tony_kernel_e2e.ts
        shell: bash

      - name: Run TypeScript tests
        run: |
          bun test ./tests/test_judgment_memory_hooks.ts
        shell: bash

      - name: Validate configuration
        run: |
          bun run tools/validate-config.ts
        shell: bash

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          cd docker && docker compose build
        shell: bash
