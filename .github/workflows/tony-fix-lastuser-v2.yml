name: tony-fix-lastuser-v2

on:
  push:
    branches: [opencode2]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'tony: fix lastUser parts')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opencode2

      - name: Fix lastUser message access
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('packages/opencode/src/session/prompt.ts')
          s = p.read_text()

          start = s.index('const userObjective = lastUser.parts')
          line_start = s.rfind('\n', 0, start) + 1
          end = s.index('const kernel = yield* Effect.promise(() =>', start)

          replacement = '''            const lastUserMsg = msgs.findLast(
              (msg) => msg.info.role === "user" && msg.info.id === lastUser.id,
            )
            const userObjective = lastUserMsg?.parts
              .filter((part): part is SessionV1.TextPart => part.type === "text")
              .map((part) => part.text)
              .join("\\n") ?? ""\n\n            '''

          p.write_text(s[:line_start] + replacement + s[end:])
          PY

      - name: Commit fix and remove workflow files
        run: |
          rm -f .github/workflows/tony-fix-lastuser.yml .github/workflows/tony-fix-lastuser-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/opencode/src/session/prompt.ts .github/workflows/
          git commit -m 'tony: fix lastUser parts'
          git push origin HEAD:opencode2
