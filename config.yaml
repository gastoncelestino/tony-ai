macros:
  llamaServerBase: >
    /home/tony/llama.cpp/build/bin/llama-server
    --port ${PORT}
    --host 0.0.0.0
    --flash-attn on

models:
  qwen3-coder-30b:
    aliases:
      - "qwen3-coder:30b"
    cmd: |
      ${llamaServerBase}
      --model /home/tony/.tony-ai/models/qwen3-coder-30B.q4_k_m.gguf
      --ctx-size 32768
      --n-gpu-layers 99
      --n-cpu-moe 30
      --cache-type-k q8_0
      --cache-type-v q8_0
      --parallel 1
      --temp 0
      --top-k 1
    ttl: 600

  ornith-1.5-9b:
    aliases:
      - "ornith-1.5-9b"
    cmd: |
      ${llamaServerBase}
      --model /home/tony/.tony-ai/models/ornith-1.5-9b-q5_k_m.gguf
      --ctx-size 131072
      --n-gpu-layers 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --parallel 1
      --temp 0
      --top-k 1
    ttl: 600
    
  deepseek-r1-8b:
    aliases:
      - "deepseek-r1:8b"
    cmd: |
      ${llamaServerBase}
      --model /home/tony/.tony-ai/models/deepseek-r1-8b.q5_k_m.gguf
      --ctx-size 32768
      --n-gpu-layers 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --parallel 1
      --jinja
      --reasoning-budget 4096
      --n-predict 8192
      --temp 0.60
      --top-p 0.95
      --min-p 0.05
      --repeat-penalty 1.0
      --log-verbosity 3
    ttl: 600

  nomic-embed-text:
    aliases:
      - "nomic-embed-text"
    cmd: |
      ${llamaServerBase}
      --model /home/tony/.tony-ai/models/nomic-embed-text-v1.5.q8_0.gguf
      --embedding
      --pooling mean
      --ctx-size 8192
      --n-gpu-layers 99
    ttl: 600

  bge-m3:
    aliases:
      - "bge-m3"
    cmd: |
      ${llamaServerBase}
      --model /home/tony/.tony-ai/models/bge-m3-q8_0.gguf
      --embedding
      --pooling cls
      --ctx-size 8192
      --n-gpu-layers 99
    ttl: 600