[pytest]
testpaths = tests
# El cache se mantiene fuera del checkout y lo define el entorno/Makefile.
cache_dir = $PYTEST_CACHE_DIR
markers =
    concurrency: multiprocess and persistence race tests
    mcp: JSON-RPC contract tests for the kernel MCP server
    integration: tests that exercise multiple kernel components
    e2e: end-to-end workflow tests
