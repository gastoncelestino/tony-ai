# docker/docker-compose.yml
#
# Backing services for TonyMem's memory stack: Ollama (embeddings) + Qdrant
# (vector storage). These are what code-index/ and judgment-memory/ talk to
# over HTTP (TONY_OLLAMA_URL / TONY_QDRANT_URL) — see docker/README.md for
# why the MCP servers themselves (local-memory, code-index, judgment-memory)
# are NOT containerized here.
#
# Default ports (11434, 6333) match the defaults already baked into
# code-index/core.py, judgment-memory/ledger.py, plugins/qdrant.ts, and
# opencode.json — so with defaults, nothing else in the repo needs to
# change to point at these containers instead of natively-installed
# Ollama/Qdrant.
#
# Usage: see docker/README.md (NixOS-specific notes: Docker vs Podman,
# GPU passthrough via docker-compose.gpu.yml).

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: tony-ai-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"   # REST — matches TONY_QDRANT_URL default
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant's image doesn't reliably ship curl/wget across versions;
      # /dev/tcp is a bash builtin, no extra binary needed. NOT verified
      # against a real container from this environment (no Docker Hub
      # access in this sandbox) — if it reports unhealthy on your machine
      # despite Qdrant actually working, drop the healthcheck block and
      # rely on `curl http://localhost:6333/readyz` manually instead.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: tony-ai-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"   # matches TONY_OLLAMA_URL default
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      # `ollama list` uses the same binary the server runs, so a
      # successful call means the server is actually accepting requests
      # — this is the well-established pattern for this image, unlike
      # the qdrant healthcheck above.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # GPU passthrough: see docker-compose.gpu.yml (merge with -f), plus
    # the NixOS-specific nvidia-container-toolkit setup in README.md.
    # CPU-only works fine for the small models used here (nomic-embed-text,
    # bge-m3) — GPU mainly matters for the LLM agents themselves, which
    # are a separate concern from this compose file.

  # One-shot: pulls the embedding models this repo actually calls, then
  # exits. Re-running `docker compose up` after models are already pulled
  # is a fast no-op (ollama pull is idempotent / checks existing layers).
  ollama-pull:
    image: ollama/ollama:latest
    container_name: tony-ai-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "pulling ${JUDGMENT_EMBED_MODEL:-nomic-embed-text} (judgment-memory)..."
        ollama pull "${JUDGMENT_EMBED_MODEL:-nomic-embed-text}"
        echo "pulling ${CODE_EMBED_MODEL:-bge-m3} (code-index)..."
        ollama pull "${CODE_EMBED_MODEL:-bge-m3}"
        echo "models ready"
    restart: "no"

volumes:
  qdrant_storage:
  ollama_models:
