name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system deps
        run: |
          if command -v make >/dev/null 2>&1 && command -v sqlite3 >/dev/null 2>&1; then
            echo "make and sqlite3 already available"
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "apt-get update attempt ${attempt}/3"
            if timeout 120s sudo apt-get update -qq; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: apt-get update failed or timed out after 3 attempts"
              exit 1
            fi
            sleep 5
          done

          timeout 120s sudo apt-get install -y -qq make sqlite3
        shell: bash

      - name: Install Python dev/test dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Validate test discovery conventions
        run: make check-test-discovery
        shell: bash

      - name: Run complete local suite
        run: make test
        shell: bash

      - name: Run complete coverage
        if: matrix.python-version == '3.12'
        run: make coverage
        shell: bash

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          cd docker && docker compose build
        shell: bash
